[package]
name = "timestream"
version = "0.1.0"
description = "Local-first Git client with a TVA Chronomonitor timeline"
authors = ["you"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "timestream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# keyring 3 has no default stores; without these it uses a mock that
# cannot be read back from a new Entry (login succeeds, later API calls fail).
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
toml = "0.8"
toml_edit = "0.22"
dirs = "6"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
