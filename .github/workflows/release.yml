# Bundle Timestream for Windows (NSIS), Linux (AppImage), and macOS (DMG).
# Trigger: push a version tag (`v0.1.0`) or run from Actions → Release → Run workflow.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TIMESTREAM_GITHUB_CLIENT_ID: ${{ secrets.TIMESTREAM_GITHUB_CLIENT_ID }}
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-nsis
            os: windows-latest
            artifact: timestream-windows-nsis
          - name: linux-appimage
            os: ubuntu-22.04
            artifact: timestream-linux-appimage
          - name: macos-arm
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: timestream-macos-aarch64
          - name: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: timestream-macos-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            pkg-config

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Caches cargo registry + compiled deps (src-tauri/target). Keyed per
      # artifact so macos-arm and macos-intel do not share a target dir.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: v1-tauri
          key: ${{ matrix.artifact }}
          cache-directories: |
            ~/.cache/tauri
            ~/Library/Caches/tauri
            ~/AppData/Local/tauri

      - run: bun install --frozen-lockfile

      - name: Bundle
        run: >
          bun scripts/bundle-release.ts --skip-tests
          ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -name SHA256SUMS -exec cat {} \; | sort -k2 > dist/SHA256SUMS
          find artifacts -type f ! -name SHA256SUMS -exec cp -v {} dist/ \;
          ls -la dist

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
