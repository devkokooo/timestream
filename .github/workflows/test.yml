# Run the AGENTS.md gate on every PR and every push to sacred,
# except site-only changes (marketing site is a separate Netlify deploy).
name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - sacred
    paths-ignore:
      - "site/**"
  pull_request:
    paths-ignore:
      - "site/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Global tarball store: lockfile bumps still reuse unchanged packages.
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      # Linked tree: exact lockfile hit skips most of `bun install`.
      - uses: actions/cache@v5
        with:
          path: node_modules
          key: bun-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - name: Vitest
        run: bun run test

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Gallery production build
        run: bunx vite build --config vite.gallery.config.ts

  rust:
    name: rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      # WebKit/GTK debs are the slow part of a Tauri Linux runner.
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libappindicator3-dev
            librsvg2-dev
            libgtk-3-dev
            libsecret-1-dev
            pkg-config
          version: 1.0

      - uses: dtolnay/rust-toolchain@stable

      # Cargo registry + compiled dependency artifacts in src-tauri/target.
      # shared-key keeps PRs and sacred on the same restore prefix.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: v1-ci
          shared-key: cargo-test
          cache-on-failure: true

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
